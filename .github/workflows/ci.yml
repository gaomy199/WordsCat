name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: ./build.ps1
      - name: Verify offline (no interactive UI)
        run: ./verify.ps1
      - name: Check secrets
        run: ./scripts/check-secrets.ps1
      - name: Check source
        run: ./scripts/check-source.ps1
